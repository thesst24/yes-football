<div class="container bg-[#f5f6fa] max-w-full flex justify-center items-center min-h-screen p-4">
  
  <div class="wrapper relative w-full max-w-[508px] min-h-[500px] sm:min-h-[594px] m-auto shadow-2xl rounded-3xl flex flex-col justify-between items-center bg-white p-6 sm:p-10">
    
    <div class="logo">
      <img src="logo.png" alt="logo" (click)="onLogoClick()" class="w-[180px] h-[180px] sm:w-[250px] sm:h-[250px] object-contain" />
    </div>
    
    <div class="box-input w-full flex flex-col justify-center items-center gap-6 sm:gap-8 mb-10 sm:mb-20">
      
      <div class="input-tel w-full max-w-[356px]">
        <input
          type="tel"
          name="phone"
          id="phone"
          [(ngModel)]="whatsapp"
          (input)="error=''"
          placeholder="20 xxx-xxx-xx"
          maxlength="12"
          inputmode="numeric"
          pattern="[0-9]*"
          required
          class="border-[1px] border-[#1976d2] w-full h-[56px] p-3 focus:border-[2px] focus:border-[#1946d2] outline-none rounded-[4px] text-lg"
        />
      </div>

      <button
        type="submit"
        (click)="login()"
        class="btn-login rounded-[4px] text-white w-full max-w-[356px] h-[55px] hover:bg-[#0F68C0] active:scale-95 transition-transform cursor-pointer text-center bg-[#1976d2] text-[15px] font-semibold"
      >
        LOGIN
      </button>

      <p class="error text-red-500 text-sm text-center" *ngIf="error">{{ error }}</p>
    </div>
  </div>

  <div *ngIf="showPopup" class="card-login-failed absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 w-[90%] max-w-[400px] h-auto rounded-[30px] sm:rounded-[40px] bg-white shadow-2xl py-8 px-6 sm:px-10 flex flex-col justify-center items-center gap-6">
    <div class="logo-failed text-center">
      <img src="failed.png" alt="failed" class="w-[60px] h-[60px] sm:w-[83px] sm:h-[83px] mx-auto" />
      <p class="text-[#f44336] text-xl sm:text-2xl font-bold mt-2">Failed</p>
    </div>
    <p class="text-lg sm:text-xl font-medium text-center">Invalid mobile number</p>
    <button (click)="closePopup()" class="rounded-xl sm:rounded-2xl bg-[#f44336] w-full h-[48px] text-white font-bold text-lg sm:text-xl active:opacity-80">
      OK
    </button>
  </div>
</div>
